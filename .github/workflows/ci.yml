name: Build and test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobileApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Build and run unit tests
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - name: Check release API configuration
        run: |
          if bash ./gradlew --no-daemon :app:generateReleaseBuildConfig; then
            echo 'Release configuration unexpectedly succeeded without an API origin' >&2
            exit 1
          fi
          bash ./gradlew --no-daemon :app:generateReleaseBuildConfig -PevmapReleaseApiUrl=https://api.example.invalid/

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: serverApp
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: evmap_password_reset_test
          POSTGRES_USER: reset_test
          POSTGRES_PASSWORD: local-ci-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reset_test -d evmap_password_reset_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      EVMAP_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/evmap_password_reset_test?currentSchema=evmap,public
      EVMAP_TEST_DB_USER: reset_test
      EVMAP_TEST_DB_PASSWORD: local-ci-test
      SPRING_PROFILES_ACTIVE: local,test-legacy
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_APPLICATION_JSON: '{"app":{"security":{"password-reset":{"mail-poll-ms":86400000,"cleanup-ms":86400000}}}}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run server and migration tests
        run: bash ./gradlew --no-daemon test
